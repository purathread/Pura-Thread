<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlift - Premium Lift Sistemləri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #050505; color: #fff;
            perspective: 1500px; /* 3D Kamera Dərinliyi */
        }

        /* --- 1. GİRİŞ SLAYDERİ (Kamera Effekti İlə) --- */
        #sliderView {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            /* Kameranın geriyə və ya irəliyə getməsi üçün transformasiya */
            transition: opacity 1.2s ease, transform 1.5s cubic-bezier(0.19, 1, 0.22, 1);
            transform-style: preserve-3d;
        }
        
        .bg-layer { 
            position: absolute; inset: -5%; background-size: cover; background-position: center; 
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1); z-index: 1; filter: brightness(0.4);
            transform: translateZ(0) scale(1.1);
        }
        .bg-layer.active { opacity: 1; transform: translateZ(0) scale(1); z-index: 2; }
        .bg-layer.exit { opacity: 0; transform: translateZ(200px) scale(1.2); z-index: 3; } /* Kamera içəri girir */
        
        .circle-positioner { position: relative; z-index: 4; width: 45vh; height: 45vh; margin-bottom: 5vh; perspective: 1000px; }
        .circle-spinner { 
            width: 100%; height: 100%; border-radius: 50%; position: relative; 
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); overflow: hidden; border: 2px solid rgba(255,255,255,0.1); 
        }
        .circle-slide { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 1s ease; }
        #cSlide1 { opacity: 1; } #cSlide2 { opacity: 0; }
        
        .text-content { position: relative; z-index: 4; text-align: center; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); }
        .text-content h1 { font-size: 3.5rem; font-weight: 900; color: #f0c040; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 2px; }
        .text-content p { font-size: 1.1rem; max-width: 600px; color: #ddd; }
        .hidden-text { opacity: 0; transform: translateY(30px) scale(0.9); }
        
        .next-btn { position: relative; z-index: 4; margin-top: 40px; padding: 15px 45px; background: #f0c040; color: #000; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: transform 0.3s, box-shadow 0.3s; }
        .next-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(240,192,64,0.3); }
        .next-btn:active { transform: scale(0.95); }

        /* --- 2. KATALOQ VƏ 3D LİFT --- */
        #catalogView {
            position: absolute; inset: 0; z-index: 5; opacity: 0; visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            /* Kataloqun 3D məkanı */
            transform-style: preserve-3d;
            transform: translateZ(-500px) rotateY(10deg);
            transition: opacity 1.5s ease, transform 2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .catalog-active #catalogView { 
            opacity: 1; visibility: visible; z-index: 20; 
            transform: translateZ(0) rotateY(0deg); 
        }
        
        /* Slayder arxaya doğru solaraq uzaqlaşır */
        .catalog-active #sliderView { 
            opacity: 0; pointer-events: none; transform: translateZ(300px) scale(1.2); 
        }

        /* Liftin Qutusu */
        .elevator-wrapper {
            position: absolute;
            width: 320px; height: 520px;
            transform: translate(0, 0) scale(1) rotateY(0deg);
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1), box-shadow 1.5s ease;
            cursor: pointer;
            z-index: 10;
            transform-style: preserve-3d;
        }

        /* Liftə kliklədikdə kamera kənara sürüşür və lift önə gəlir */
        .elevator-wrapper.expanded {
            transform: translate(-60%, 0) scale(1.3) rotateY(5deg);
            cursor: default;
            box-shadow: 30px 20px 80px rgba(0,0,0,0.9);
        }

        .elevator-frame {
            position: relative; width: 100%; height: 100%;
            border: 20px solid #2a2a2a; border-bottom: none;
            background: #000; overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
            display: flex;
        }

        /* Kabin İnteryeri (Arxa plan - Sizin pişik şəkli və ya standart) */
        .cabin-interior {
            position: absolute; inset: 0;
            background: url('https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=600&q=80') center/cover;
            filter: brightness(0.6);
            transition: filter 1s ease;
        }
        .elevator-wrapper:hover .cabin-interior { filter: brightness(1); }

        /* Qapılar */
        .door {
            position: absolute; top: 0; bottom: 0; width: 50%;
            background: url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=400&q=80') center/cover;
            border: 1px solid #111;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.15, 1);
            z-index: 2; box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        }
        .door-left { left: 0; border-right: 2px solid #050505; transform-origin: left; }
        .door-right { right: 0; border-left: 2px solid #050505; transform-origin: right; }

        /* Qapıların Açılması */
        .elevator-wrapper:hover .door-left, .elevator-wrapper.touch-open .door-left { transform: translateX(-95%); }
        .elevator-wrapper:hover .door-right, .elevator-wrapper.touch-open .door-right { transform: translateX(95%); }

        /* --- TƏNZİMLƏMƏLƏR PANELİ (Sağ Tərəf) --- */
        .config-panel {
            position: absolute; right: 10%; width: 380px;
            opacity: 0; transform: translateX(100px) translateZ(-100px) rotateY(-10deg); 
            pointer-events: none;
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
            transition-delay: 0.2s;
        }
        .elevator-wrapper.expanded ~ .config-panel { 
            opacity: 1; transform: translateX(0) translateZ(0) rotateY(0deg); 
            pointer-events: auto; 
        }

        .config-panel h2 { font-size: 2.2rem; color: #fff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: -1px;}
        .price { font-size: 3.5rem; color: #f0c040; font-weight: 900; margin-bottom: 5px; line-height: 1; }
        .warning { color: #ff4d4d; font-size: 0.9rem; font-weight: 600; margin-bottom: 35px; }

        .controls { background: rgba(25,25,25,0.8); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .ctrl-label { font-size: 1rem; font-weight: 600; color: #999; margin-bottom: 12px; display: block; }
        
        .floor-ctrl { display: flex; align-items: center; justify-content: space-between; background: #0a0a0a; border-radius: 10px; overflow: hidden; margin-bottom: 25px; border: 1px solid #333; padding: 5px; }
        .floor-ctrl button { background: #222; color: #fff; border: none; width: 50px; height: 50px; border-radius: 8px; font-size: 1.5rem; cursor: pointer; transition: background 0.3s; }
        .floor-ctrl button:hover { background: #f0c040; color: #000; }
        .floor-ctrl span { font-size: 1.8rem; font-weight: 900; width: 60px; text-align: center; }

        .btn-interior { background: #f0c040; color: #000; border: none; width: 100%; padding: 20px; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 10px; transition: transform 0.2s, background 0.3s; }
        .btn-interior:active { transform: scale(0.95); }

        /* --- 3. İNTERYERƏ KEÇİD (ƏSL KAMERA EFEKTİ İLƏ) --- */
        body.interior-mode #catalogView {
            /* Kamera sürətlə liftin içinə doğru girir */
            transform: translateZ(1200px) rotateY(-5deg); 
            opacity: 0; pointer-events: none;
            transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease 0.3s;
        }

        #interiorView {
            position: absolute; inset: 0; z-index: 50; opacity: 0; visibility: hidden;
            background: url('https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=1920&q=80') center/cover;
            display: flex; align-items: center; justify-content: center;
            /* İnteryer öncə arxada olur, sonra kameranın qarşısına gəlir */
            transform: translateZ(-500px) scale(1.1);
            transition: opacity 1.5s ease, transform 1.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        body.interior-mode #interiorView { 
            opacity: 1; visibility: visible; 
            transform: translateZ(0) scale(1);
        }

        /* Liftin Düymə Paneli */
        .cop-panel {
            background: linear-gradient(145deg, #e0e0e0, #999);
            border: 3px solid #555; border-radius: 12px;
            padding: 30px 20px; width: 160px;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.8), inset 2px 2px 10px #fff;
            display: flex; flex-direction: column-reverse; align-items: center; gap: 15px;
            max-height: 85vh; overflow-y: auto;
            transform: translateY(50px); opacity: 0;
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1) 0.5s;
        }
        body.interior-mode .cop-panel { transform: translateY(0); opacity: 1; }
        .cop-panel::-webkit-scrollbar { width: 0; }

        .lift-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #bbb);
            border: 2px solid #666; color: #111; font-weight: 900; font-size: 1.3rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.4), inset -2px -2px 5px rgba(0,0,0,0.2);
            cursor: pointer; transition: 0.2s;
        }
        .lift-btn:active { transform: scale(0.9); box-shadow: inset 4px 4px 8px rgba(0,0,0,0.6); color: #e60000; }

        .btn-back { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); color: #fff; padding: 12px 25px; border: 1px solid rgba(255,255,255,0.3); font-weight: 800; cursor: pointer; border-radius: 8px; transition: 0.3s; z-index: 100;}
        .btn-back:hover { background: #f0c040; color: #000; border-color: #f0c040;}

        @media (max-width: 768px) {
            .circle-positioner { width: 75vw; height: 75vw; }
            .elevator-wrapper { width: 240px; height: 380px; }
            .elevator-wrapper.expanded { transform: translate(0, -35%) scale(1.1) rotateY(0); }
            .config-panel { right: 5%; left: 5%; width: 90%; bottom: 2%; transform: translateY(100px) translateZ(-50px); }
            .elevator-wrapper.expanded ~ .config-panel { transform: translateY(0) translateZ(0); }
            body.interior-mode #catalogView { transform: translateZ(1000px) translateY(-20%); }
            .price { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ SLAYDERİ -->
    <div id="sliderView">
        <div class="bg-layer active" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>

        <div class="circle-positioner">
            <div class="circle-spinner" id="spinner">
                <div class="circle-slide" id="cSlide1"></div>
                <div class="circle-slide" id="cSlide2"></div>
            </div>
        </div>
        <div class="text-content" id="textContent">
            <h1 id="title"></h1>
            <p id="desc"></p>
        </div>
        <button class="next-btn" id="nextBtn" onclick="nextAction()">Növbəti &rarr;</button>
    </div>

    <!-- 2. KATALOQ VƏ LİFT -->
    <div id="catalogView">
        
        <!-- Lift Qutusu -->
        <div class="elevator-wrapper" id="elevator" onclick="expandElevator()" ontouchstart="touchOpen()" ontouchend="touchClose()" ontouchcancel="touchClose()">
            <div class="elevator-frame">
                <div class="cabin-interior" id="mainInteriorBg"></div>
                <div class="door door-left"></div>
                <div class="door door-right"></div>
            </div>
        </div>

        <!-- Tənzimləmələr -->
        <div class="config-panel">
            <h2>Starlift Premium</h2>
            <div class="price" id="priceDisplay">$35,000</div>
            <div class="warning">* Quraşdırılma qiymətə daxil deyil</div>
            
            <div class="controls">
                <span class="ctrl-label">Mərtəbə Seçimi (+ $200)</span>
                <div class="floor-ctrl">
                    <button onclick="changeFloor(-1)">-</button>
                    <span id="floorCount">1</span>
                    <button onclick="changeFloor(1)">+</button>
                </div>
                <button class="btn-interior" onclick="goToInterior()">İnteryerinə Keçid</button>
            </div>
        </div>
    </div>

    <!-- 3. İNTERYER GÖRÜNÜŞÜ -->
    <div id="interiorView">
        <button class="btn-back" onclick="backToCatalog()">X Geri Qayıt</button>
        <div class="cop-panel" id="buttonPanel">
            <!-- Düymələr bura avtomatik əlavə olunur -->
        </div>
    </div>

    <script>
        // Ümumi dəyişənlər
        const slides = [
            { title: "Liftlərin Quraşdırılması", desc: "Premium keyfiyyətli liftlərin təhlükəsiz və peşəkar şəkildə quraşdırılması.", img: "https://images.unsplash.com/photo-1574766861502-3c1ee127bcfb?auto=format&fit=crop&w=800&q=80" },
            { title: "Liftlərin Dizaynı", desc: "İnteryerinizə uyğun müasir, lüks və xüsusi dizaynlı kabin həlləri.", img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=800&q=80" },
            { title: "Texniki Servis", desc: "7/24 fasiləsiz və operativ texniki xidmət ilə liftlərinizin ömrünü uzadırıq.", img: "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=800&q=80" }
        ];

        let currentIndex = 0, currentRotation = 0, activeBg = 1, isAnimating = false;
        const BASE_PRICE = 35000, FLOOR_PRICE = 200;
        let currentFloors = 1, isExpanded = false;

        function initSlider() {
            document.getElementById('cSlide1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('bg1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('title').innerText = slides[0].title;
            document.getElementById('desc').innerText = slides[0].desc;
        }

        // --- KAMERA EFEKTİ İLƏ SLAYDER KEÇİDİ ---
        function nextAction() {
            if (isAnimating) return;

            if (currentIndex === slides.length - 1) {
                document.body.classList.add('catalog-active');
                return;
            }

            isAnimating = true;
            currentIndex++;
            currentRotation -= 120; 

            const textContent = document.getElementById('textContent');
            const spinner = document.getElementById('spinner');
            
            if (currentIndex === slides.length - 1) {
                setTimeout(() => { document.getElementById('nextBtn').innerText = "Kataloqa Keçid"; }, 600);
            }

            const currentBgEl = document.getElementById(`bg${activeBg}`);
            const nextBgId = activeBg === 1 ? 2 : 1;
            const nextBgEl = document.getElementById(`bg${nextBgId}`);

            nextBgEl.style.backgroundImage = `url('${slides[currentIndex].img}')`;
            
            // Kamera 3D Zoom effekti
            currentBgEl.classList.remove('active');
            currentBgEl.classList.add('exit');
            nextBgEl.classList.remove('exit');
            nextBgEl.classList.add('active');
            
            activeBg = nextBgId;

            const nextLayer = activeBg === 1 ? 2 : 1; 
            document.getElementById(`cSlide${nextLayer}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`cSlide${nextLayer}`).style.opacity = 1;
            document.getElementById(`cSlide${activeBg === 1 ? 2 : 1}`).style.opacity = 0;

            textContent.classList.add('hidden-text');
            spinner.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                document.getElementById('title').innerText = slides[currentIndex].title;
                document.getElementById('desc').innerText = slides[currentIndex].desc;
                textContent.classList.remove('hidden-text');
                isAnimating = false;
            }, 700);
        }

        // --- LİFTİN QAPILARI VƏ MOBİL DOKUNUŞ ---
        function touchOpen() { document.getElementById('elevator').classList.add('touch-open'); }
        function touchClose() { document.getElementById('elevator').classList.remove('touch-open'); }

        function expandElevator() {
            if(!isExpanded) {
                document.getElementById('elevator').classList.add('expanded');
                isExpanded = true;
            }
        }

        // --- QİYMƏT HESABLANMASI ---
        function changeFloor(delta) {
            currentFloors += delta;
            if(currentFloors < 1) currentFloors = 1; 

            document.getElementById('floorCount').innerText = currentFloors;
            const finalPrice = BASE_PRICE + ((currentFloors - 1) * FLOOR_PRICE);
            document.getElementById('priceDisplay').innerText = "$" + finalPrice.toLocaleString();
        }

        // --- KAMERA İLƏ İNTERYERƏ GİRMƏ (ZOOM) ---
        function goToInterior() {
            document.body.classList.add('interior-mode');
            renderInteriorButtons();
        }

        function backToCatalog() {
            document.body.classList.remove('interior-mode');
        }

        function renderInteriorButtons() {
            const panel = document.getElementById('buttonPanel');
            panel.innerHTML = '';
            for(let i = 1; i <= currentFloors; i++) {
                const btn = document.createElement('div');
                btn.className = 'lift-btn';
                btn.innerText = i;
                panel.appendChild(btn);
            }
        }

        initSlider();
    </script>
</body>
</html>
