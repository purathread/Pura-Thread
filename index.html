<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlift - Premium Lift Sistemləri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #0c0c0c; color: #fff;
        }

        /* --- 1. GİRİŞ SLAYDERİ --- */
        #sliderView {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease, transform 1s cubic-bezier(0.65, 0, 0.15, 1);
        }
        .bg-layer { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(20px); transition: opacity 1s ease; z-index: 1; }
        #bg1 { opacity: 1; } #bg2 { opacity: 0; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 2; }
        
        .circle-positioner { position: relative; z-index: 3; width: 50vh; height: 50vh; margin-bottom: 5vh; }
        .circle-spinner { width: 100%; height: 100%; border-radius: 50%; position: relative; transition: transform 1s cubic-bezier(0.65, 0, 0.15, 1); box-shadow: 0 15px 50px rgba(0,0,0,0.8); overflow: hidden; border: 3px solid #333; }
        .circle-slide { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 0.8s ease; }
        #cSlide1 { opacity: 1; } #cSlide2 { opacity: 0; }
        
        .text-content { position: relative; z-index: 3; text-align: center; transition: all 0.5s; }
        .text-content h1 { font-size: 3rem; font-weight: 900; color: #f0c040; text-transform: uppercase; margin-bottom: 10px; }
        .text-content p { font-size: 1.2rem; max-width: 600px; color: #ccc; }
        .hidden-text { opacity: 0; transform: translateY(20px); }
        
        .next-btn { position: relative; z-index: 3; margin-top: 30px; padding: 15px 40px; background: #f0c040; color: #000; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: transform 0.2s; }
        .next-btn:active { transform: scale(0.95); }

        /* --- 2. KATALOQ VƏ LİFT (3D ANIMASİYALAR) --- */
        #catalogView {
            position: absolute; inset: 0; z-index: 5; opacity: 0; visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #2a2a2a 0%, #000 100%);
            transition: opacity 1s ease; perspective: 1200px;
        }

        .catalog-active #catalogView { opacity: 1; visibility: visible; z-index: 20; }
        .catalog-active #sliderView { opacity: 0; pointer-events: none; transform: scale(1.1); }

        /* Liftin Qutusu */
        .elevator-wrapper {
            position: absolute;
            width: 300px; height: 500px;
            transform: translate(0, 0) scale(1);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), box-shadow 1s ease;
            cursor: pointer;
            z-index: 10;
        }

        /* 3D Sola Böyüyüb Yaxınlaşma Effekti */
        .elevator-wrapper.expanded {
            transform: translate(-50%, 0) scale(1.4);
            cursor: default;
            box-shadow: 20px 0 50px rgba(0,0,0,0.8);
        }

        .elevator-frame {
            position: relative; width: 100%; height: 100%;
            border: 15px solid #444; border-bottom: none;
            background: #111; overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            display: flex;
        }

        /* Kabin İnteryeri (Arxa plan) */
        .cabin-interior {
            position: absolute; inset: 0;
            background: url('https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=600&q=80') center/cover;
            filter: brightness(0.7);
        }

        /* Qapılar */
        .door {
            position: absolute; top: 0; bottom: 0; width: 50%;
            background: url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=400&q=80') center/cover;
            border: 1px solid #222;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.15, 1);
            z-index: 2; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .door-left { left: 0; border-right: 2px solid #111; }
        .door-right { right: 0; border-left: 2px solid #111; }

        /* Qapıların Açılması (Hover və Touch) */
        .elevator-wrapper:hover .door-left, .elevator-wrapper.touch-open .door-left { transform: translateX(-95%); }
        .elevator-wrapper:hover .door-right, .elevator-wrapper.touch-open .door-right { transform: translateX(95%); }

        /* --- TƏNZİMLƏMƏLƏR PANELİ (Sağ Tərəf) --- */
        .config-panel {
            position: absolute; right: 10%; width: 350px;
            opacity: 0; transform: translateX(50px); pointer-events: none;
            transition: all 1s cubic-bezier(0.77, 0, 0.175, 1);
            transition-delay: 0.3s;
        }
        .elevator-wrapper.expanded ~ .config-panel { opacity: 1; transform: translateX(0); pointer-events: auto; }

        .config-panel h2 { font-size: 2rem; color: #fff; margin-bottom: 5px; text-transform: uppercase;}
        .price { font-size: 3rem; color: #f0c040; font-weight: 900; margin-bottom: 5px; }
        .warning { color: #ff4d4d; font-size: 0.9rem; font-weight: 600; margin-bottom: 30px; letter-spacing: 0.5px; }

        .controls { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .ctrl-label { font-size: 1rem; font-weight: 600; color: #aaa; margin-bottom: 10px; display: block; }
        
        .floor-ctrl { display: flex; align-items: center; justify-content: space-between; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 25px; border: 1px solid #333; }
        .floor-ctrl button { background: #222; color: #fff; border: none; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer; transition: background 0.3s; }
        .floor-ctrl button:hover { background: #f0c040; color: #000; }
        .floor-ctrl span { font-size: 1.5rem; font-weight: 900; width: 60px; text-align: center; }

        .btn-interior { background: #f0c040; color: #000; border: none; width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 8px; transition: transform 0.2s; }
        .btn-interior:active { transform: scale(0.95); }

        /* --- 3. İNTERYERƏ KEÇİD (ZOOM VƏ 3D EFEKT) --- */
        body.interior-mode #catalogView {
            transform: scale(4) translateX(20%); /* Ekran liftin içinə girir */
            opacity: 0; pointer-events: none;
            transition: transform 1.5s cubic-bezier(0.65, 0, 0.15, 1), opacity 1.5s ease;
        }

        #interiorView {
            position: absolute; inset: 0; z-index: 50; opacity: 0; visibility: hidden;
            background: url('https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=1920&q=80') center/cover;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 1s ease; transition-delay: 0.5s;
        }

        body.interior-mode #interiorView { opacity: 1; visibility: visible; }

        /* Liftin Düymə Paneli */
        .cop-panel {
            background: linear-gradient(135deg, #bbb, #777);
            border: 2px solid #555; border-radius: 10px;
            padding: 30px 20px; width: 150px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.8), inset 2px 2px 5px rgba(255,255,255,0.5);
            display: flex; flex-direction: column-reverse; align-items: center; gap: 15px;
            max-height: 80vh; overflow-y: auto;
        }
        .cop-panel::-webkit-scrollbar { width: 0; }

        .lift-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle, #eee, #aaa);
            border: 2px solid #444; color: #000; font-weight: 900; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5), inset 1px 1px 3px #fff;
            cursor: pointer; transition: 0.2s;
        }
        .lift-btn:active { transform: scale(0.9); box-shadow: inset 3px 3px 5px rgba(0,0,0,0.5); color: #e60000; }

        .btn-back { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.6); color: #fff; padding: 10px 25px; border: 1px solid #fff; font-weight: 800; cursor: pointer; border-radius: 5px; }

        @media (max-width: 768px) {
            .circle-positioner { width: 80vw; height: 80vw; }
            .elevator-wrapper { width: 220px; height: 350px; }
            .elevator-wrapper.expanded { transform: translate(0, -30%) scale(1.1); }
            .config-panel { right: 5%; left: 5%; width: 90%; bottom: 5%; transform: translateY(50px); }
            .elevator-wrapper.expanded ~ .config-panel { transform: translateY(0); }
            body.interior-mode #catalogView { transform: scale(4) translateY(20%); }
            .price { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ SLAYDERİ -->
    <div id="sliderView">
        <div class="bg-layer" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>
        <div class="overlay"></div>

        <div class="circle-positioner">
            <div class="circle-spinner" id="spinner">
                <div class="circle-slide" id="cSlide1"></div>
                <div class="circle-slide" id="cSlide2"></div>
            </div>
        </div>
        <div class="text-content" id="textContent">
            <h1 id="title"></h1>
            <p id="desc"></p>
        </div>
        <button class="next-btn" id="nextBtn" onclick="nextAction()">Növbəti &rarr;</button>
    </div>

    <!-- 2. KATALOQ VƏ LİFT -->
    <div id="catalogView">
        
        <!-- Lift Qutusu -->
        <div class="elevator-wrapper" id="elevator" onclick="expandElevator()" ontouchstart="touchOpen()" ontouchend="touchClose()" ontouchcancel="touchClose()">
            <div class="elevator-frame">
                <div class="cabin-interior"></div>
                <div class="door door-left"></div>
                <div class="door door-right"></div>
            </div>
        </div>

        <!-- Tənzimləmələr -->
        <div class="config-panel">
            <h2>Starlift Premium</h2>
            <div class="price" id="priceDisplay">$35,000</div>
            <div class="warning">* Quraşdırılma qiymətə daxil deyil</div>
            
            <div class="controls">
                <span class="ctrl-label">Mərtəbə Seçimi (+ $200)</span>
                <div class="floor-ctrl">
                    <button onclick="changeFloor(-1)">-</button>
                    <span id="floorCount">1</span>
                    <button onclick="changeFloor(1)">+</button>
                </div>
                <button class="btn-interior" onclick="goToInterior()">İnteryerinə Keçid</button>
            </div>
        </div>
    </div>

    <!-- 3. İNTERYER GÖRÜNÜŞÜ -->
    <div id="interiorView">
        <button class="btn-back" onclick="backToCatalog()">X Geri Qayıt</button>
        <div class="cop-panel" id="buttonPanel">
            <!-- Düymələr bura avtomatik əlavə olunur -->
        </div>
    </div>

    <script>
        // --- SLAYDER MƏNTİQİ (3 MƏLUMAT) ---
        const slides = [
            { title: "Liftlərin Quraşdırılması", desc: "Premium keyfiyyətli liftlərin təhlükəsiz və peşəkar şəkildə quraşdırılması.", img: "https://images.unsplash.com/photo-1574766861502-3c1ee127bcfb?auto=format&fit=crop&w=800&q=80" },
            { title: "Liftlərin Dizaynı", desc: "İnteryerinizə uyğun müasir, lüks və xüsusi dizaynlı kabin həlləri.", img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=800&q=80" },
            { title: "Texniki Servis", desc: "7/24 fasiləsiz və operativ texniki xidmət ilə liftlərinizin ömrünü uzadırıq.", img: "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=800&q=80" }
        ];

        let currentIndex = 0;
        let currentRotation = 0;
        let activeBg = 1;
        let isAnimating = false;

        function initSlider() {
            document.getElementById('cSlide1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('bg1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('title').innerText = slides[0].title;
            document.getElementById('desc').innerText = slides[0].desc;
        }

        function nextAction() {
            if (isAnimating) return;

            // 3-cü slayddan sonra Kataloqa keçid
            if (currentIndex === slides.length - 1) {
                document.body.classList.add('catalog-active');
                return;
            }

            isAnimating = true;
            currentIndex++;
            currentRotation -= 120; // 3 element olduğu üçün hər dəfə 120 dərəcə

            const textContent = document.getElementById('textContent');
            const spinner = document.getElementById('spinner');
            
            if (currentIndex === slides.length - 1) {
                setTimeout(() => { document.getElementById('nextBtn').innerText = "Kataloqa Keçid"; }, 500);
            }

            const nextBg = activeBg === 1 ? 2 : 1;
            document.getElementById(`bg${nextBg}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`bg${nextBg}`).style.opacity = 1;
            document.getElementById(`bg${activeBg}`).style.opacity = 0;
            activeBg = nextBg;

            const nextLayer = activeBg === 1 ? 2 : 1; // Slide layer
            document.getElementById(`cSlide${nextLayer}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`cSlide${nextLayer}`).style.opacity = 1;
            document.getElementById(`cSlide${activeBg === 1 ? 2 : 1}`).style.opacity = 0;

            textContent.classList.add('hidden-text');
            spinner.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                document.getElementById('title').innerText = slides[currentIndex].title;
                document.getElementById('desc').innerText = slides[currentIndex].desc;
                textContent.classList.remove('hidden-text');
                isAnimating = false;
            }, 500);
        }

        // --- KATALOQ VƏ LİFT MƏNTİQİ ---
        const BASE_PRICE = 35000;
        const FLOOR_PRICE = 200;
        let currentFloors = 1;
        let isExpanded = false;

        function touchOpen() { document.getElementById('elevator').classList.add('touch-open'); }
        function touchClose() { document.getElementById('elevator').classList.remove('touch-open'); }

        // Liftə kliklədikdə böyüyür və sola keçir
        function expandElevator() {
            if(!isExpanded) {
                document.getElementById('elevator').classList.add('expanded');
                isExpanded = true;
            }
        }

        // Mərtəbəni dəyişmək və qiyməti hesablamaq
        function changeFloor(delta) {
            currentFloors += delta;
            if(currentFloors < 1) currentFloors = 1; // Minimum 1 mərtəbə

            document.getElementById('floorCount').innerText = currentFloors;
            
            // Qiymət hesablaması: İlk mərtəbə əsas qiymətə daxildir, artan hər mərtəbə +200$
            const finalPrice = BASE_PRICE + ((currentFloors - 1) * FLOOR_PRICE);
            
            // Qiyməti formatla göstərmək (məsələn: $35,200)
            document.getElementById('priceDisplay').innerText = "$" + finalPrice.toLocaleString();
        }

        // --- İNTERYERƏ KEÇİD VƏ DÜYMƏLƏRİN YARADILMASI ---
        function goToInterior() {
            document.body.classList.add('interior-mode');
            renderInteriorButtons();
        }

        function backToCatalog() {
            document.body.classList.remove('interior-mode');
        }

        // Mərtəbə sayına görə düymələri dinamik yaratmaq
        function renderInteriorButtons() {
            const panel = document.getElementById('buttonPanel');
            panel.innerHTML = '';
            
            // Düymələr aşağıdan yuxarı (1, 2, 3...) düzülsün deyə CSS-də column-reverse istifadə etmişik
            for(let i = 1; i <= currentFloors; i++) {
                const btn = document.createElement('div');
                btn.className = 'lift-btn';
                btn.innerText = i;
                panel.appendChild(btn);
            }
        }

        // Başlanğıc funksiyanı çağır
        initSlider();
    </script>
</body>
</html>
