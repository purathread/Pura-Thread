<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pura Thread — Premium Collection</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0f1013;
      --card-bg: #17181c;
      --accent: #d4af37; /* Lüks Qızılı / Matt Gold */
      --accent-hover: #e5c158;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 16, 19, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .logo span {
      color: var(--accent);
    }

    .cart-btn {
      position: relative;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }

    .cart-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .cart-badge {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 0.75rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 70px 20px 40px;
      animation: fadeIn 1s ease-out;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    /* Product Grid */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }

    .product-img-box {
      width: 100%;
      height: 300px;
      overflow: hidden;
      position: relative;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .product-details {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .product-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .product-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .add-to-cart-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-to-cart-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.03);
    }

    /* Cart Sidebar Modal */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .cart-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: #141518;
      z-index: 201;
      padding: 25px;
      display: flex;
      flex-direction: column;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    .cart-sidebar.active {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .close-cart {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .close-cart:hover {
      color: var(--text-main);
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .cart-item-price {
      color: var(--accent);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .qty-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .checkout-btn {
      width: 100%;
      background: #e1306c; /* Instagram brend rəngi */
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
    }

    .checkout-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
      z-index: 300;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">Pura <span>Thread</span></div>
    <button class="cart-btn" onclick="toggleCart()">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Səbət</span>
      <div class="cart-badge" id="cartCount">0</div>
    </button>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>PURA THREAD</h1>
    <p>Premium Material • Zamansız Dizayn</p>
  </section>

  <!-- Main Products Container -->
  <div class="container">
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- Cart Modal Sidebar -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2>Səbətiniz</h2>
      <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="cart-items" id="cartItems">
      <!-- Səbət məhsulları buraya dinamik əlavə olunur -->
    </div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>Cəmi:</span>
        <span id="cartTotalSum">0 AZN</span>
      </div>
      <button class="checkout-btn" onclick="sendToInstagram()">
        <i class="fa-brands fa-instagram"></i>
        Instagram ilə Sifariş Et
      </button>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast">Məhsul səbətə əlavə olundu!</div>

  <script>
    // =============================================================
    // 1. MƏHSULLAR SİYAHISI (Buradan qiymət və məhsulları dəyişə bilərsiniz)
    // =============================================================
    const INSTAGRAM_USERNAME = "purathread"; // Instagram istifadəçi adınız

    const products = [
      {
        id: 1,
        name: "Pura Hoodie (3 İplik)",
        desc: "95% Pambıq, Yumşaq & Premium Material",
        price: 25,
        image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        name: "Pura Minimal T-Shirt",
        desc: "Süprəm 100% Pambıq, Rahat Kesim",
        price: 19,
        image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        name: "Pura Polo Sweater",
        desc: "Lacos Qarışımlı, Eleqant Stil",
        price: 21,
        image: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        name: "Pura Cırtlı Kepka",
        desc: "Standart Şəhər Stili Aksesuar",
        price: 15,
        image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let cart = [];

    // Məhsulları ekrana düzmək
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = products.map((p, index) => `
        <div class="product-card" style="animation-delay: ${index * 0.1}s">
          <div class="product-img-box">
            <img src="${p.image}" alt="${p.name}" class="product-img">
          </div>
          <div class="product-details">
            <h3 class="product-title">${p.name}</h3>
            <p class="product-desc">${p.desc}</p>
            <div class="product-bottom">
              <span class="product-price">${p.price} AZN</span>
              <button class="add-to-cart-btn" onclick="addToCart(${p.id})">
                <i class="fa-solid fa-plus"></i> Səbətə
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Səbətə əlavə etmək
    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        const prod = products.find(p => p.id === id);
        cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
      showToast("Məhsul səbətə əlavə olundu");
    }

    // Səbət miqdarını dəyişmək
    function updateQty(id, change) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += change;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    }

    // Səbət görüntüsünü yeniləmək
    function updateCartUI() {
      const cartItemsDiv = document.getElementById('cartItems');
      const cartCountSpan = document.getElementById('cartCount');
      const cartTotalSpan = document.getElementById('cartTotalSum');

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      cartCountSpan.innerText = totalItems;
      cartTotalSpan.innerText = totalPrice + " AZN";

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top:30px;">Səbətiniz boşdur.</p>';
        return;
      }

      cartItemsDiv.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.image}" class="cart-item-img">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-price">${item.price * item.qty} AZN</div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
              <span>${item.qty} ədəd</span>
              <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Səbət pəncərəsini aç/bağla
    function toggleCart() {
      document.getElementById('cartOverlay').classList.toggle('active');
      document.getElementById('cartSidebar').classList.toggle('active');
    }

    // Bildiriş çıxarmaq
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // =============================================================
    // 2. INSTAGRAM-A SİFARİŞ İNFORMASİYASI GÖNDƏRMƏK
    // =============================================================
    function sendToInstagram() {
      if (cart.length === 0) {
        alert("Lütfən əvvəlcə səbətə məhsul əlavə edin.");
        return;
      }

      let message = "Salam Pura Thread! Saytdan belə bir sifariş vermək istəyirəm:\n\n";
      let total = 0;

      cart.forEach((item, i) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        message += `${i + 1}. ${item.name} - ${item.qty} ədəd (${itemTotal} AZN)\n`;
      });

      message += `\nCəmi Məbləğ: ${total} AZN`;

      // Mətni müştərinin buferinə (clipboard) kopyala
      navigator.clipboard.writeText(message).then(() => {
        alert("Sifariş məlumatları kopyalandı! Instagram açıldıqda mesaj bölməsinə yapışdırın (Paste/Вставить).");
        window.open(`https://instagram.com/${INSTAGRAM_USERNAME}`, '_blank');
      }).catch(() => {
        window.open(`https://instagram.com/${INSTAGRAM_USERNAME}`, '_blank');
      });
    }

    // İlkin yükləmə
    renderProducts();
  </script>
</body>
</html>
